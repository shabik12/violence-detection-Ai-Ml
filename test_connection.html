<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Test</title>
</head>
<body>
    <h1>ThingSpeak Connection Test</h1>
    <div id="status">Testing connection...</div>
    <div id="data"></div>
    
    <script>
        async function testConnection() {
            try {
                const url = 'https://api.thingspeak.com/channels/2374983/feeds.json?results=5';
                console.log('Testing:', url);
                
                const response = await fetch(url);
                console.log('Status:', response.status);
                
                const data = await response.json();
                console.log('Data:', data);
                
                document.getElementById('status').innerHTML = '✅ Connection successful!';
                
                let html = '<h2>Recent Data:</h2>';
                data.feeds.forEach((feed, index) => {
                    html += `<p>${index + 1}. ${feed.created_at}: ${feed.field2 || 'N/A'} at (${feed.field3 || 'N/A'}, ${feed.field4 || 'N/A'})</p>`;
                });
                
                document.getElementById('data').innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        testConnection();
    </script>
</body>
</html>
